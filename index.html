<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/style/style.css">
</head>
<body>
    <aside>
        <h1>Tchernobyl - Reactor 4</h1>
        <h2>Génération de la Grille</h2>
        <label>
            <input type="number" id="gridWidth"> Largeur
        </label>
        <label>
            <input type="number" id="gridHeight"> Hauteur
        </label>
        <button id="gridCreation">Générer la Grille</button>
        <h2>Sélectionnez votre Builder</h2>
        <section>
            <label for="offRadio"><input type="radio" id="offRadio" name="builder" checked>Désactivé</label>
            <label for="wallRadio"><input type="radio" id="wallRadio" name="builder">Mur</label>
            <label for="startRadio"><input type="radio" id="startRadio" name="builder">Départ</label>
            <label for="endRadio"><input type="radio" id="endRadio" name="builder">Arrivé</label>
        </section>
        <h2>Pathfinding Settings</h2>
        <label>
            <input type="checkbox" id="toggleDifficulty" checked> Difficulté
        </label>
        <label>
            <input type="checkbox" id="toggleDiagonal"> Diagonales
        </label>

        <label for="algoSelect">Algorithme</label>
        <select id="algoSelect">
            <optgroup label="Heuristique">
                <option value="astar">A*</option>
                <option value="greedy">Greedy - Best-First Search</option>
                <option value="biDirectionalAStar">Bidirectionnel A* (non Optimal)</option>
                <option value="biDirectionalAStarOpti">Bidirectionnel A* (Optimal)</option>
            </optgroup>
            <optgroup label="Non Heuristique">
                <option value="dijkstra">Dijkstra</option>
                <option value="bfs">BFS - Breadth-First Search</option>
                <option value="biDirectionalDijkstra">Bidirectionnel Dijkstra (non Optimal)</option>
                <option value="biDirectionalDijkstraOpti">Bidirectionnel Dijkstra (Optimal)</option>
            </optgroup>  
        </select>

        <label for="heuristiqueSelect">heuristique</label>
        <select id="heuristiqueSelect">
            <option value="manhattan">Distance de Manhattan</option>
            <option value="chebyshev">Distance de Chebyshev</option>
            <option value="euclidienne">Distance Euclidienne</option>
            <option value="octile">Distance d'Octile</option>
        </select>

        <h2>ACTION !</h2>
        <button id="pathfinder">Trouver le chemin</button>
        <button id="resetPartial">Reset Partiel</button>
        <button id="resetTotal">Reset Total</button>

        <h2>Dungeon Generator</h2>
        <label>
            <input type="number" id="roomMinSize"> Taille minimum d'une pièce
        </label>
        <label>
            <input type="number" id="roomMaxSize"> Taille maximum d'une pièce
        </label>
        <button id="generateDungeonBSP">Générer Donjon BSP</button>
    </aside>
    
    <main id="container">

    </main>
    <script src="./src/script/Entity/Node.js"></script>
    <script src="./src/script/Entity/PriorityQueue.js"></script>
    <script src="./src/script/functions/functions.js"></script>
    <script src="./src/script/algorithms/pathfinding/heuristique.js"></script>
    <script src="./src/script/algorithms/pathfinding/aStar.js"></script>
    <script src="./src/script/algorithms/pathfinding/dijkstra.js"></script>
    <script src="./src/script/algorithms/pathfinding/bfs.js"></script>
    <script src="./src/script/algorithms/pathfinding/greedy.js"></script>
    <script src="./src/script/algorithms/pathfinding/biDirectionalAStar.js"></script>
    <script src="./src/script/algorithms/pathfinding/biDirectionalDijkstra.js"></script>
    <script src="./src/script/algorithms/pathfinding/biDirectionalDijkstraOpti.js"></script>
    <script src="./src/script/algorithms/pathfinding/biDirectionalAStarOpti.js"></script>
    <script src="./src/script/Entity/BSPNode.js"></script>
    <script src="./src/script/algorithms/generators/dungeon/bspDungeon.js"></script>
    <script src="./src/script/script.js"></script>
</body>
</html>
