<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/style/style.css">
</head>
<body>
    <aside>
        <h1>Tchernobyl - Reactor 4</h1>
        <button id="pathfinder">Trouver le chemin</button>
        <label>
            <input type="checkbox" id="toggleDifficulty" checked> Difficulté
        </label>
        <label>
            <input type="checkbox" id="toggleDiagonal" checked> Diagonales
        </label>

        <label for="algoSelect">Algorithme</label>
        <select id="algoSelect">
            <option value="astar">A*</option>
            <option value="dijkstra">Dijkstra</option>
            <option value="bfs">BFS - Breadth-First Search</option>
            <option value="greedy">Greedy - Best-First Search</option>
            <option value="biDirectionalAStar">Bidirectionnel A*</option>
            <option value="biDirectionalDijkstra">Bidirectionnel Dijkstra</option>
        </select>

        <label for="heuristiqueSelect">heuristique</label>
        <select id="heuristiqueSelect">
            <option value="manhattan">Distance de Manhattan</option>
            <option value="chebyshev">Distance de Chebyshev</option>
            <option value="euclidienne">Distance Euclidienne</option>
            <option value="octile">Distance d'Octile</option>
        </select>

        <button id="resetPartial">Reset Partiel</button>
        <button id="resetTotal">Reset Total</button>
    </aside>
    
    <main id="container">

    </main>
    <script src="./src/script/Entity/Node.js"></script>
    <script src="./src/script/Entity/PriorityQueue.js"></script>
    <script src="./src/script/functions/functions.js"></script>
    <script src="./src/script/algorithms/heuristique.js"></script>
    <script src="./src/script/algorithms/aStar.js"></script>
    <script src="./src/script/algorithms/dijkstra.js"></script>
    <script src="./src/script/algorithms/bfs.js"></script>
    <script src="./src/script/algorithms/greedy.js"></script>
    <script src="./src/script/algorithms/biDirectionalAStar.js"></script>
    <script src="./src/script/algorithms/biDirectionalDijkstra.js"></script>
    <script src="./src/script/script.js"></script>
</body>
</html>
